# API 规范

## 基础配置

- 基础地址：`/api/v1`
- 认证：`Authorization: Bearer {token}`
- 内容类型：`application/json`

## 统一响应格式

```yaml
ApiResponse:
  type: object
  properties:
    code:
      type: integer
      description: 业务状态码，0 表示成功
    data:
      type: object
      description: 响应数据
    message:
      type: string
      description: 响应消息
```

## HTTP 状态码

| 状态码 | 含义 |
|--------|------|
| 200 | 成功 |
| 401 | 未授权 |
| 403 | 禁止访问 |
| 404 | 资源不存在 |
| 500 | 服务器内部错误 |
| 502 | 网关错误 |
| 503 | 服务不可用 |
