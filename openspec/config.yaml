# OpenSpec 配置文件
# 规范基于 https://github.com/Fission-AI/OpenSpec

version: "1"

# ============================================================
# Proposal（提案）规则
# ============================================================
proposal:
  # 必须包含的部分
  required_sections:
    - intent          # 意图：解决什么问题
    - scope           # 范围：包含什么
    - non_goals       # 非目标：明确不包含什么
    - approach        # 方案：如何实现

  # 格式要求
  format:
    # scope 部分必须包含 non_goals 子节
    scope_must_include_non_goals: true

    # approach 必须包含决策理由
    approach_must_include_rationale: true

  # 命名规则
  naming:
    # proposal 文件命名格式
    pattern: "{change_id}_{short_description}.md"
    change_id_prefix: "prop"

# ============================================================
# Delta Spec（增量规格）规则
# ============================================================
delta_spec:
  # 必须包含的章节标记
  required_markers:
    - ADDED      # 新增内容
    - MODIFIED   # 修改内容
    - REMOVED    # 移除内容

  # 场景格式：GIVEN-WHEN-THEN
  scenario_format:
    required: true
    keywords:
      - GIVEN    # 前置条件
      - WHEN     # 触发动作
      - THEN     # 预期结果

  # 每个 ADDED/MODIFIED 条目必须包含场景
  require_scenarios: true

# ============================================================
# Design（设计）规则
# ============================================================
design:
  # 必须包含的部分
  required_sections:
    - file_changes     # 文件变更清单
    - dependencies     # 依赖变化
    - api_contract    # API 契约（如有涉及）

  # 文件变更格式
  file_changes:
    # 必须包含变更类型
    require_change_type: true
    change_types:
      - create      # 新建
      - modify      # 修改
      - delete      # 删除
      - rename      # 重命名

  # API 契约格式
  api_contract:
    # 必须包含请求/响应格式
    require_request_response: true

    # 格式要求
    format:
      - method      # HTTP 方法
      - path        # 请求路径
      - request     # 请求格式
      - response    # 响应格式
      - errors      # 错误码

# ============================================================
# Tasks（任务）规则
# ============================================================
tasks:
  # 时间约束
  time_constraint:
    # 每个任务最大时长（小时）
    max_duration_hours: 2

  # 编号格式：层级式编号
  numbering:
    pattern: "{level1}.{level2}.{level3}"
    max_depth: 3

  # 可验证性要求
  verifiable:
    # 每个任务必须有验收标准
    require_acceptance_criteria: true

    # 格式：必须可执行/可检查
    acceptance_format: executable

  # 状态流转
  status:
    allowed:
      - pending      # 待开始
      - in_progress  # 进行中
      - completed    # 已完成
      - blocked      # 被阻塞

# ============================================================
# Change（变更）元数据
# ============================================================
change:
  # 状态
  status:
    allowed:
      - proposed     # 已提案
      - approved     # 已批准
      - in_progress  # 进行中
      - completed    # 已完成
      - archived     # 已归档

  # 追踪
  tracking:
    # 变更 ID 格式
    id_pattern: "{prefix}-{number}"
    prefix: "CHG"
    start_number: 1
